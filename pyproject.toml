[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-revenue-forecast"
version = "1.0.0"
description = "Time-series forecasting system for game monetization metrics"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Alex Wang", email = "alex@example.com"}
]
keywords = ["time-series", "forecasting", "machine-learning", "ensemble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "catboost>=1.0.0",
    "lightgbm>=3.3.0",
    "optuna>=3.0.0",
    "pyyaml>=5.4.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "python-dotenv>=0.19.0",
    "openpyxl>=3.6.0",
    "statsmodels>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/Alex-Wang66/GameRevenueForecast"
Repository = "https://github.com/Alex-Wang66/GameRevenueForecast.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py38']
